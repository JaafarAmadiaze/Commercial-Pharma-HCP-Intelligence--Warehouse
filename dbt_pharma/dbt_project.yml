name: 'dbt_pharma'
version: '1.0.0'
config-version: 2

profile: 'pharma_project'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  require_explicit_package_overrides_for_builtin_materializations: false

models:
  dbt_pharma:
    staging:
      +materialized: view
      +schema: RAW
    intermediate:
      +materialized: table
      +schema: INTERMEDIATE
    marts:
      +materialized: table
      +schema: MARTS

  elementary:
    +schema: "ELEMENTARY"
